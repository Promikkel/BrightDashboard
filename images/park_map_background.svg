<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f0f0f0"/>
  
  <!-- Grass areas -->
  <path d="M50,50 L950,50 L950,550 L50,550 Z" fill="#e8f4e8"/>
  
  <!-- Pathways -->
  <path d="M100,100 L900,100 L900,500 L100,500 Z" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <path d="M500,100 L500,500" stroke="#ddd" stroke-width="8" stroke-dasharray="5,5"/>
  <path d="M100,300 L900,300" stroke="#ddd" stroke-width="8" stroke-dasharray="5,5"/>
  
  <!-- Lakes -->
  <ellipse cx="800" cy="400" rx="80" ry="60" fill="#d4f1f9" stroke="#a8e1f5" stroke-width="2"/>
  <ellipse cx="200" cy="200" rx="60" ry="40" fill="#d4f1f9" stroke="#a8e1f5" stroke-width="2"/>
  
  <!-- Trees -->
  <g>
    <!-- Zone A Trees -->
    <circle cx="150" cy="150" r="15" fill="#a8d5a8"/>
    <circle cx="180" cy="130" r="12" fill="#a8d5a8"/>
    <circle cx="120" cy="170" r="10" fill="#a8d5a8"/>
    <circle cx="300" cy="150" r="15" fill="#a8d5a8"/>
    <circle cx="330" cy="180" r="12" fill="#a8d5a8"/>
    
    <!-- Zone B Trees -->
    <circle cx="650" cy="150" r="15" fill="#a8d5a8"/>
    <circle cx="680" cy="130" r="12" fill="#a8d5a8"/>
    <circle cx="620" cy="170" r="10" fill="#a8d5a8"/>
    <circle cx="700" cy="180" r="15" fill="#a8d5a8"/>
    <circle cx="730" cy="150" r="12" fill="#a8d5a8"/>
    
    <!-- Zone C Trees -->
    <circle cx="150" cy="450" r="15" fill="#a8d5a8"/>
    <circle cx="180" cy="430" r="12" fill="#a8d5a8"/>
    <circle cx="120" cy="470" r="10" fill="#a8d5a8"/>
    <circle cx="200" cy="450" r="15" fill="#a8d5a8"/>
    <circle cx="230" cy="420" r="12" fill="#a8d5a8"/>
    
    <!-- Zone D Trees -->
    <circle cx="650" cy="450" r="15" fill="#a8d5a8"/>
    <circle cx="680" cy="430" r="12" fill="#a8d5a8"/>
    <circle cx="620" cy="470" r="10" fill="#a8d5a8"/>
    <circle cx="700" cy="420" r="15" fill="#a8d5a8"/>
    <circle cx="730" cy="450" r="12" fill="#a8d5a8"/>
  </g>
  
  <!-- Zone Boundaries -->
  <path d="M100,100 L500,100 L500,300 L100,300 Z" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M500,100 L900,100 L900,300 L500,300 Z" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M100,300 L500,300 L500,500 L100,500 Z" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M500,300 L900,300 L900,500 L500,500 Z" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Zone Labels -->
  <text x="300" y="150" font-family="Arial" font-size="24" font-weight="bold" fill="#666" text-anchor="middle">Zone A</text>
  <text x="700" y="150" font-family="Arial" font-size="24" font-weight="bold" fill="#666" text-anchor="middle">Zone B</text>
  <text x="300" y="450" font-family="Arial" font-size="24" font-weight="bold" fill="#666" text-anchor="middle">Zone C</text>
  <text x="700" y="450" font-family="Arial" font-size="24" font-weight="bold" fill="#666" text-anchor="middle">Zone D</text>
  
  <!-- Accommodation Placeholders (will be replaced by actual units in the app) -->
  <rect x="200" y="200" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="300" y="200" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="200" y="400" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="300" y="400" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="600" y="200" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="700" y="200" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="600" y="400" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  <rect x="700" y="400" width="50" height="50" fill="none" stroke="#ccc" stroke-width="2" rx="5" ry="5"/>
  
  <!-- Reception Building -->
  <rect x="450" y="50" width="100" height="30" fill="#f8f8f8" stroke="#ccc" stroke-width="2"/>
  <text x="500" y="70" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Receptie</text>
  
  <!-- Parking Area -->
  <rect x="450" y="520" width="100" height="30" fill="#eee" stroke="#ccc" stroke-width="2"/>
  <text x="500" y="540" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Parkeren</text>
  
  <!-- Compass -->
  <circle cx="950" cy="50" r="20" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <path d="M950,30 L950,70" stroke="#ccc" stroke-width="1"/>
  <path d="M930,50 L970,50" stroke="#ccc" stroke-width="1"/>
  <text x="950" y="40" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">N</text>
  <text x="950" y="65" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">Z</text>
  <text x="935" y="53" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">W</text>
  <text x="965" y="53" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">O</text>
</svg>
